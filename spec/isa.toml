instructions = [
  { funct = 0x0, mnemonic = "V_CMP.EQ",  syntax = "sd, va, vb|sb", op = "eq" },
  { funct = 0x1, mnemonic = "V_CMP.NE",  syntax = "sd, va, vb|sb", op = "ne" },
  { funct = 0x2, mnemonic = "V_CMP.LT",  syntax = "sd, va, vb|sb", op = "lt" },
  { funct = 0x3, mnemonic = "V_CMP.LE",  syntax = "sd, va, vb|sb", op = "le" },
  { funct = 0x4, mnemonic = "V_CMP.GT",  syntax = "sd, va, vb|sb", op = "gt" },
  { funct = 0x5, mnemonic = "V_CMP.GE",  syntax = "sd, va, vb|sb", op = "ge" },
  { funct = 0x6, mnemonic = "V_CMP.LTU", syntax = "sd, va, vb|sb", op = "ltu" },
