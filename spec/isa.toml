  { funct = 0xA, mnemonic = "V_CMP.FLT", syntax = "sd, va, vb|sb", op = "flt" },
  { funct = 0xB, mnemonic = "V_CMP.FLE", syntax = "sd, va, vb|sb", op = "fle" },
  { funct = 0xC, mnemonic = "V_CMP.FGT", syntax = "sd, va, vb|sb", op = "fgt" },
  { funct = 0xD, mnemonic = "V_CMP.FGE", syntax = "sd, va, vb|sb", op = "fge" },
  { funct = 0xE, mnemonic = "V_CMP.GTU", syntax = "sd, va, vb|sb", op = "gtu" },
  { funct = 0xF, mnemonic = "V_CMP.GEU", syntax = "sd, va, vb|sb", op = "geu" },
]

[[group]]
name = "V_R4"
opcode = 0x05
format = "R4"
exec = "mask"
unit = "VALU"
instructions = [
  { funct = 0x0, mnemonic = "V_FFMA", syntax = "vd, va, vb|sb, vc", op = "ffma", unit = "FPU" },
  { funct = 0x1, mnemonic = "V_IMAD", syntax = "vd, va, vb|sb, vc", op = "imad" },
  { funct = 0x2, mnemonic = "V_SEL",  syntax = "vd, va, vb|sb, sc", op = "sel" },
]

[[group]]
name = "V_LANE"
opcode = 0x06
