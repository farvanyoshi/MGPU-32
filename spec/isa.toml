# ---------------------------------------------------------------------------------------
# Pseudo-instructions (section 7.11). Expansions use ${operand} substitution; the
# assembler documents its exact rules in docs/toolchain/assembler.md.
# ---------------------------------------------------------------------------------------
[[pseudo]]
mnemonic = "S_MOV"
syntax = "sd, sa"
expansion = ["S_ADD ${sd}, ${sa}, s0"]
[[pseudo]]
mnemonic = "S_LI"
syntax = "sd, imm32"
expansion = ["S_LUI ${sd}, %hi(${imm32})", "S_ORI ${sd}, ${sd}, %lo(${imm32})"]
[[pseudo]]
mnemonic = "V_MOV"
syntax = "vd, va"
expansion = ["V_ADD ${vd}, ${va}, v0"]
[[pseudo]]
mnemonic = "V_BCAST"
syntax = "vd, sa"
expansion = ["V_ADD ${vd}, v0, ${sa}"]
[[pseudo]]
mnemonic = "V_NOT"
syntax = "vd, va"
expansion = ["V_SUB ${vd}, v0, ${va}", "V_ADDI ${vd}, ${vd}, -1"]
[[pseudo]]
mnemonic = "V_FNEG"
syntax = "vd, va, st"
expansion = ["S_LUI ${st}, 0x8000", "V_XOR ${vd}, ${va}, ${st}"]
[[pseudo]]
mnemonic = "V_FABS"
syntax = "vd, va, st"
expansion = ["S_LUI ${st}, 0x8000", "V_ANDN ${vd}, ${va}, ${st}"]
[[pseudo]]
mnemonic = "V_FDIV"
syntax = "vd, va, vb, vt"
expansion = ["V_FRCP ${vt}, ${vb}", "V_FMUL ${vd}, ${va}, ${vt}"]
[[pseudo]]
mnemonic = "S_MOVEXEC"
syntax = "sd"
expansion = ["S_ADD ${sd}, s31, s0"]

